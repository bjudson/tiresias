[project]
name = "tiresias"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "python-dotenv",
    "python-frontmatter",
    "click",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[project.scripts]
dream = "cli:dream"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actions", "lib", "web"]
force-include = { "cli.py" = "cli.py" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
